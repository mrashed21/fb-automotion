name: Facebook Auto Poster

on:
  schedule:
    - cron: "0 2 * * *"   # সকাল ৮টা BD
    - cron: "0 6 * * *"   # দুপুর ১২টা BD
    - cron: "0 9 * * *"   # বিকাল ৩টা BD
    - cron: "0 12 * * *"  # সন্ধ্যা ৬টা BD
    - cron: "0 15 * * *"  # রাত ৯টা BD
  workflow_dispatch:
    inputs:
      post_type:
        description: "Post type (irony/info/article/random)"
        required: false
        default: "random"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine post type
        id: post_type
        run: |
          HOUR=$(date -u +%H)
          INPUT_TYPE="${{ github.event.inputs.post_type }}"

          echo "Current UTC hour: $HOUR"

          if [ -n "$INPUT_TYPE" ] && [ "$INPUT_TYPE" != "random" ]; then
            echo "flag=--$INPUT_TYPE" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "02" ] || [ "$HOUR" = "2" ] || [ "$HOUR" = "9" ] || [ "$HOUR" = "09" ]; then
            echo "flag=--irony" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "06" ] || [ "$HOUR" = "6" ] || [ "$HOUR" = "15" ]; then
            echo "flag=--info" >> $GITHUB_OUTPUT
          else
            echo "flag=--article" >> $GITHUB_OUTPUT
          fi

      - name: Run poster
        env:
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: npx ts-node src/index.ts ${{ steps.post_type.outputs.flag }}

      # Repo active রাখার জন্য dummy commit
      - name: Keep repo active
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          echo "Last run: $(date -u)" > .last-run
          git add .last-run
          git commit -m "chore: keep alive [skip ci]" || echo "Nothing to commit"
          git push || echo "Push failed"
